# This workflow uses actions that are not certified by GitHub.

name: QTTabBar

on:
  push:
    branches: [ vs2019, win11-probe-session ]
  pull_request:
    branches: [ vs2019, win11-probe-session ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: 'QTTabBar Rebirth.sln'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: '6.x'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: NuGet Restore
      run: nuget restore $env:Solution_Name

    - name: Rebuild the application
      run: msbuild $env:Solution_Name /t:Rebuild /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Run unit tests
      run: |
        dotnet restore Tests/QTTtabBarTests/QTTtabBarTests.csproj
        dotnet test Tests/QTTtabBarTests/QTTtabBarTests.csproj --configuration Release --no-restore --verbosity normal

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: QTTabBar
        path: |
          QTTabBar\bin\Release\**\*

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          QTTabBar\bin\Release\**\*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
